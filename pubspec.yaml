name: futbol_app
description: "App interactiva de fútbol para Quilicura con sistema territorial y ranking ELO"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  
  # Estado y Navegación
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.5.1
  go_router: ^14.2.7
  
  # Base de datos y Backend
  supabase_flutter: ^2.8.0
  
  # Animaciones y UI
  lottie: ^3.1.2
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  
  # Mapas y Geolocalización
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  
  # Imágenes y Multimedia
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  
  # Utilidades
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  
  # UI Components
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  
  # Serialización y Modelos
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  riverpod_generator: ^2.5.1
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
